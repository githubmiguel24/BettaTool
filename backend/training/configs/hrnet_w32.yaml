# config for training hrnet with noisy labels and teacher distillation on fish fins

experiment_name: hrnet_w32_noisy_labels

loss:
  # target shape matters here since heatmp loss is KL vs sum-normalized target
  lambda_heatmap: 1.0
  # detaching mu so nLL only trains sigma and doesnt pull toward bad labels
  nll_detach_mu: true
  # stretching targets across the fin ray since error is mostly perpendicular
  heatmap_target_anisotropy:
    enabled: true
    across_scale: 2.0          # sigma across is double the normal px scale
    keypoints: [dorsal_tip, caudal_tip_upper, caudal_tip_lower, caudal_center, anal_tip]


# handling messy human anotations
noisy_labels:
  fin_keypoints: [dorsal_tip, caudal_tip_upper, caudal_tip_lower, caudal_center, anal_tip]
  ambiguous_weight: 0.5        # flagged keypoints only count half for loss
  distill_alpha_ambiguous: 0.5 # how much we trust the EMA teacher for fuzzy labels
  distill_alpha_fin: 0.25      # teacher weight on all fins capped at 1 total
  distill_start_epoch: 15      # wait for EMA to actually get good before using it
  trim_fraction: 0.10          # drop the worst 10 percent of predictions
  trim_start_epoch: 15         # start trimming bad preds from this epoch


training:
  stage2_epochs: 80            # max since the training never reaches 80 and beause of the patience part
  ema:
    enabled: true
    decay: 0.998               # 500 step horizon so about the last 7 epochs
  early_stopping:
    metric: val_nll            # radial error picks epoch 0 which is dead wrong
  checkpoint:
    save_every_epoch: true
    keep: [best, best_nll, best_tip, last]   # keeping tracking of best metrics and lowest fin error

logging:
  log_val_calibration: true



# scale factors for each measurement
measurement_factor:
  caudal-spread-angle: {scale: 2.382401, tsi_scale: 2.382401}
  dorsal-body-ratio: {scale: 1.820048, tsi_scale: 1.820048}
  anal-body-ratio: {scale: 1.470516, tsi_scale: 1.470516}
  caudal-body-ratio: {scale: 1.342412, tsi_scale: 1.342412}
  anal-length-width-ratio: {scale: 1.567879, tsi_scale: 1.567879}