# v2 experiment: PREPARED, NOT RUN. Deep-merged on top of base.yaml like hrnet_w32.yaml.
# Loss and model code are unchanged. Aim: shrink the train/val gap (train mean error 7.1px vs val 14.9px)
# with stronger augmentation and weight decay, and log val NLL / coverage every epoch.
#
#   python -m training.train_hrnet --config training/configs/hrnet_w32_v2.yaml
#
# NOTE: needs the train_hrnet.py edit listed in the plan to log val NLL/coverage and save best_nll.pt;
# until that edit exists, the keys under `training.checkpoint` / `logging` below are ignored (harmless).

experiment_name: hrnet_w32_v2_nll

augmentation:
  train:
    hflip_p: 0.5                 # unchanged; flip/keypoint mirroring verified correct (see flip_check.py)
    rotate_deg: 25               # was 15
    scale_range: [0.75, 1.25]    # was [0.85, 1.15]
    translate_frac: 0.08         # was 0.05
    color_jitter:
      brightness: 0.4            # was 0.3
      contrast: 0.4              # was 0.3
      saturation: 0.5            # was 0.35
      hue: 0.08                  # was 0.05
    blur_p: 0.3                  # was 0.2
    jpeg_artifact_p: 0.3         # was 0.2
    coarse_dropout_p: 0.4        # was 0.3
    coarse_dropout_max_holes: 6  # was 4
    coarse_dropout_hole_size_frac: 0.15   # was 0.12

training:
  optimizer:
    weight_decay: 5.0e-2         # was 1.0e-4 (AdamW)
  checkpoint:
    save_every_epoch: true
    keep: [best, best_nll, last]  # best_nll.pt = lowest val NLL (new)

logging:
  log_val_calibration: true       # per-epoch val NLL + keypoint coverage at 68%/95% (new, needs train_hrnet.py edit)
