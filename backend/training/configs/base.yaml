# base defaults for all exp configs. all hyperparameters trace back here so no magic numbers

seed: 42
deterministic_cudnn: true

keypoints_config: training/configs/keypoints.yaml

paths:
  images_dir: data/raw
  annotations_dir: data/annotations
  splits_dir: data/splits
  runs_dir: training/runs

# dataset size and split config
dataset:
  expected_total_images: 1647
  splits:
    train: 0.70
    val: 0.15
    test: 0.15
  group_by: specimen_id
  stratify_by: [source, color_morph, has_occlusion]

# image geo settings
image:
  input_size: 384          # sqaure crop space padded 
  heatmap_size: 96          # stride 4 relative to input size
  stride: 4
  bbox_padding: 0.15        # fraction of fish box added to each side before cropping
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

# handles units between 96x96 heatmap space 384x384 crop space and original img space
# geomtry.py is the only place doing the math between these spaces
units:
  sigma_space: crop           # predict and clamp sigma in crop space pixels
  sigma_min_px: 0.5
  sigma_max_px: 64.0
  rho_max: 0.95
  covariance_eps: 1.0e-3

caching:
  cache_crops_in_ram: true
  memory_budget_mb: 1024

augmentation:
  train:
    hflip_p: 0.5
    rotate_deg: 15
    scale_range: [0.85, 1.15]
    translate_frac: 0.05
    color_jitter:
      brightness: 0.3
      contrast: 0.3
      saturation: 0.35
      hue: 0.05
    blur_p: 0.2
    jpeg_artifact_p: 0.2
    coarse_dropout_p: 0.3
    coarse_dropout_max_holes: 4
    coarse_dropout_hole_size_frac: 0.12
  eval_augmentation_free: true

model:
  backbone: hrnet_w32
  backbone_source: auto      # auto timm or custom
  pretrained: imagenet       # imagenet coco_pose or none
  detach_mu_for_covariance_stage1: true
  detach_mu_for_covariance_stage2: false

loss:
  heatmap_target_sigma_px: 2.0     # gaussian target sigma at 96x96 scale
  lambda_heatmap: 1.0
  lambda_mu_l1: 1.0
  lambda_nll_target: 1.0
  nll_ramp_epochs: 10              # linear ramp for lambda_nll over stage 2 epochs
  beta_nll: 0.5                    # seitzer beta-nll exponent where 0 is disbled
  grad_clip_norm: 1.0

training:
  stage1_epochs: 40
  stage2_epochs: 110
  batch_size: 8
  grad_accum_steps: 2              # effective batch is batch_size times this
  amp: true
  optimizer:
    name: adamw
    lr_heads: 1.0e-3
    lr_backbone: 1.0e-4
    weight_decay: 1.0e-4
  schedule:
    name: cosine
    warmup_epochs: 3
    restart_at_stage2: true
  early_stopping:
    active_from_stage: 2
    patience: 40
    metric: val_radial_error_px
  checkpoint:
    save_every_epoch: true
    keep: [best, last]
  num_workers: 4
  device: cuda

evaluation:
  pck_alphas: [0.02, 0.05, 0.10]
  body_length_landmarks: [snout_tip, peduncle_midpoint]  # peduncle midpoint is mean of top and bottom
  coverage_levels: [0.68, 0.95]
  bootstrap_resamples: 2000
  ci_method: wilson                # wilson or clopper_pearson near boundries
  export_best_worst_k: 20

logging:
  log_every_n_steps: 20
  metric_csv_filename: metrics.csv
  save_config_snapshot: true
  save_git_commit_hash: true